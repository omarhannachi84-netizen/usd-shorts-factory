name: Render Pinterest Pins

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug de l'article (ex: feux-de-foret-2026). Vide = tout rendre."
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Render pins
        run: |
          mkdir -p out/pins
          SLUG="${{ github.event.inputs.slug }}"

          npx remotion compositions --quiet > /tmp/all.txt 2>/dev/null || true
          COMPS=$(grep -o '^pin-[a-z0-9-]*' /tmp/all.txt | sort -u)

          if [ -z "$COMPS" ]; then
            echo "::error::Aucune composition 'pin-*' trouvee. Verifier src/Root.tsx."
            exit 1
          fi

          for comp in $COMPS; do
            if [ -n "$SLUG" ] && ! echo "$comp" | grep -q "$SLUG"; then
              continue
            fi
            echo "Rendu $comp"
            npx remotion still "$comp" "out/pins/${comp}.png"
          done

          ls -la out/pins/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pins-${{ github.run_id }}
          path: out/pins/
          retention-days: 30
          
