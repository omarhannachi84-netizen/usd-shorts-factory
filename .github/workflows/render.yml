name: Render USD Short

# Déclenché à distance par n8n via l'API GitHub :
# POST https://api.github.com/repos/<owner>/<repo>/dispatches
# { "event_type": "render-short", "client_payload": { "audioUrl": "...", "audioFileName": "...", "props": {...}, "compositionId": "USDShort" } }
on:
  repository_dispatch:
    types: [render-short]
  workflow_dispatch: # bouton "Run workflow" manuel dans l'onglet Actions, pour tester sans n8n

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Télécharger l'audio ElevenLabs
        if: github.event.client_payload.audioUrl
        env:
          AUDIO_URL: ${{ github.event.client_payload.audioUrl }}
          AUDIO_FILENAME: ${{ github.event.client_payload.audioFileName }}
        run: |
          mkdir -p public/audio
          curl -fL "$AUDIO_URL" -o "public/audio/$AUDIO_FILENAME"

      - name: Écrire les props reçues de n8n dans un fichier
        if: github.event.client_payload.props
        env:
          PROPS_JSON: ${{ toJson(github.event.client_payload.props) }}
        run: echo "$PROPS_JSON" > props.json

      - name: Render (déclenché par n8n, props personnalisées)
        if: github.event.client_payload.props
        env:
          COMPOSITION_ID: ${{ github.event.client_payload.compositionId || 'USDShort' }}
        run: npx remotion render "$COMPOSITION_ID" out/video.mp4 --props=props.json

      - name: Render (déclenché manuellement, props par défaut de la composition)
        if: ${{ !github.event.client_payload.props }}
        run: npx remotion render USDShort out/video.mp4

      - name: Publier la vidéo comme artifact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: usd-short-${{ github.run_id }}
          path: out/video.mp4
          retention-days: 14
